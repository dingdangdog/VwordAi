# 在 Actions 里填写版本号，分别构建 Windows、macOS Apple 芯片、macOS Intel 和 Linux。
# 安装包生成后才把 vX.Y.Z 打到这次提交。已有 Release 说明时不覆盖。安装包未签名。
# 推送标签不会自动构建。

name: 发布客户端

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.1.2。工作流会在当前提交上创建 v1.1.2。
        required: true
        type: string
      latest:
        description: 是否把这次 Release 标成最新。auto 在没有更高版本时标成最新；always 总是标成最新；never 不标。自动更新读取标成最新的 Release。
        required: true
        type: choice
        default: auto
        options:
          - auto
          - always
          - never
      windows:
        description: 构建 Windows x64 安装包
        required: true
        type: boolean
        default: true
      macos:
        description: 构建 macOS arm64 和 x64 安装包
        required: true
        type: boolean
        default: true
      linux:
        description: 构建 Linux x64 安装包
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  selection:
    name: 检查平台
    runs-on: ubuntu-latest
    steps:
      - name: 至少选择一个平台
        if: ${{ !inputs.windows && !inputs.macos && !inputs.linux }}
        run: |
          echo "至少选择 Windows、macOS、Linux 中的一个。"
          exit 1
      - name: 记录选择
        run: |
          echo "windows=${{ inputs.windows }} macos=${{ inputs.macos }} linux=${{ inputs.linux }} latest=${{ inputs.latest }}"

  windows:
    name: Windows
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Resolve latest
        id: latest
        env:
          INPUT_LATEST: ${{ inputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/mark-latest.sh

      - name: Prepare desktop
        uses: ./.github/actions/prepare-desktop
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Package NSIS installer
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: bash .github/scripts/publish-desktop-assets.sh windows

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ inputs.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            sums: macos-arm64
          - runner: macos-15-intel
            arch: x64
            sums: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Resolve latest
        id: latest
        env:
          INPUT_LATEST: ${{ inputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/mark-latest.sh

      - name: Prepare desktop
        uses: ./.github/actions/prepare-desktop
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Package disk images
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: bash .github/scripts/publish-desktop-assets.sh macos ${{ matrix.sums }}

  linux:
    name: Linux
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Resolve latest
        id: latest
        env:
          INPUT_LATEST: ${{ inputs.latest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/mark-latest.sh

      - name: Prepare desktop
        uses: ./.github/actions/prepare-desktop
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Install packaging libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot patchelf
          sudo apt-get install -y --no-install-recommends libfuse2 || sudo apt-get install -y --no-install-recommends libfuse2t64

      - name: Package AppImage and deb
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run package:linux

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MARK_LATEST: ${{ steps.latest.outputs.mark_latest }}
        run: bash .github/scripts/publish-desktop-assets.sh linux

  macos-manifest:
    name: macOS 更新清单
    needs: macos
    if: ${{ !cancelled() && needs.macos.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Merge macOS update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bash .github/scripts/publish-mac-update-manifest.sh
